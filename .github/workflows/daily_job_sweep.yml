name: Daily Job Sweep — BLR (5am IST)

on:
  schedule:
    # 05:00 IST = 23:30 UTC (previous calendar day)
    - cron: "30 23 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI for testing

permissions:
  contents: write  # needed to commit and push results

jobs:
  sweep:
    name: Run Job Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: job_sweep/requirements.txt

      - name: Install dependencies
        run: pip install -r job_sweep/requirements.txt

      - name: Run job sweep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python job_sweep/job_sweep.py

      - name: Commit and push results
        run: |
          git config user.name  "Job Sweep Bot"
          git config user.email "job-sweep-bot@users.noreply.github.com"
          git add job_sweep/results/
          git diff --staged --quiet && echo "No new results to commit." || (
            git commit -m "job sweep: $(date +'%Y-%m-%d') BLR results" &&
            git push origin HEAD
          )
